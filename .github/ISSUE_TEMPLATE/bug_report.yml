name: 问题反馈 / Bug report
description: 报告可复现的问题
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿包含密钥或不愿公开的图片。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果和实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、浏览器或离线版版本
